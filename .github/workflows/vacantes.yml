name: Vacantes Bogotá

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (GitHub puede atrasarlo en horas pico)
  workflow_dispatch:

permissions:
  contents: write   # para guardar data/vacantes_vistas.json

concurrency:
  group: vacantes
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar vacantes
        env:
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python vacantes_bogota.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vacantes_vistas.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Actualizar vacantes vistas [skip ci]" && git push)
