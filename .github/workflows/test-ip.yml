name: Prueba de conexión

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: IP pública del runner
        run: curl -s https://api.ipify.org; echo
      - name: Petición HTTP simple
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 https://sistemamaestro.mineducacion.gov.co/SistemaMaestro/busquedaVacantes.xhtml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspección (no notifica)
        run: python vacantes_bogota.py --inspect
